<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Illustration d'un paysage sahélien au crépuscule : dunes, architecture en banco et acacias">
  <title>Paysage sahélien stylisé</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131E38"/>
      <stop offset="45%" stop-color="#2A3557"/>
      <stop offset="72%" stop-color="#6A5138"/>
      <stop offset="100%" stop-color="#8A6234"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
    <clipPath id="frame"><rect width="1600" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#sky)"/>

    <!-- soleil bas -->
    <circle cx="1130" cy="512" r="96" fill="#C9962C" opacity="0.55"/>
    <circle cx="1130" cy="512" r="152" fill="#C9962C" opacity="0.14"/>

    <!-- bandes d'horizon -->
    <rect x="0" y="470" width="1600" height="6" fill="#C9962C" opacity="0.18"/>
    <rect x="0" y="496" width="1600" height="3" fill="#C9962C" opacity="0.12"/>

    <!-- crêtes lointaines -->
    <path d="M0 560 L180 520 L330 548 L520 508 L700 546 L900 514 L1120 552 L1330 520 L1600 556 L1600 900 L0 900 Z" fill="#3A3450" opacity="0.85"/>
    <path d="M0 618 L210 592 L420 626 L640 594 L880 630 L1140 598 L1400 632 L1600 610 L1600 900 L0 900 Z" fill="#2A2B45" opacity="0.9"/>

    <!-- architecture en banco (silhouette type Sahel : masse rectangulaire, tours, torons) -->
    <g fill="#1E2038">
      <rect x="470" y="452" width="300" height="176"/>
      <g>
        <rect x="486" y="392" width="46" height="240"/><path d="M486 392 h46 l-23 -34 Z"/>
        <rect x="596" y="366" width="54" height="266"/><path d="M596 366 h54 l-27 -40 Z"/>
        <rect x="710" y="396" width="46" height="236"/><path d="M710 396 h46 l-23 -34 Z"/>
      </g>
      <!-- torons -->
      <g fill="#141B30">
        <rect x="456" y="486" width="330" height="7"/>
        <rect x="456" y="528" width="330" height="7"/>
        <rect x="456" y="570" width="330" height="7"/>
      </g>
      <!-- ouvertures -->
      <g fill="#0D1426">
        <rect x="556" y="546" width="26" height="82"/>
        <rect x="660" y="546" width="26" height="82"/>
        <rect x="608" y="524" width="30" height="104"/>
      </g>
    </g>

    <!-- constructions basses -->
    <g fill="#1B2036">
      <rect x="180" y="556" width="150" height="76"/>
      <rect x="196" y="536" width="34" height="96"/>
      <rect x="880" y="566" width="196" height="66"/>
      <rect x="1210" y="558" width="128" height="74"/>
      <rect x="1226" y="540" width="28" height="92"/>
    </g>

    <!-- acacias -->
    <g fill="#141A2E">
      <g transform="translate(1390 632)">
        <rect x="-5" y="-92" width="10" height="92"/>
        <path d="M-96 -96 L96 -96 L58 -112 L-58 -112 Z"/>
        <path d="M-4 -96 L-58 -104 M4 -96 L58 -104" stroke="#141A2E" stroke-width="5"/>
      </g>
      <g transform="translate(112 636) scale(0.72)">
        <rect x="-5" y="-92" width="10" height="92"/>
        <path d="M-96 -96 L96 -96 L58 -112 L-58 -112 Z"/>
      </g>
      <g transform="translate(830 630) scale(0.5)">
        <rect x="-5" y="-92" width="10" height="92"/>
        <path d="M-96 -96 L96 -96 L58 -112 L-58 -112 Z"/>
      </g>
    </g>

    <!-- sol -->
    <rect x="0" y="632" width="1600" height="268" fill="#171B2E"/>
    <g stroke="#C9962C" stroke-width="2" opacity="0.14">
      <path d="M0 676 H1600"/><path d="M0 730 H1600"/><path d="M0 800 H1600"/>
    </g>
    <!-- motif bogolan au sol -->
    <g fill="#C9962C" opacity="0.13">
      <rect x="60" y="700" width="18" height="18"/><rect x="140" y="700" width="18" height="18"/>
      <rect x="220" y="700" width="18" height="18"/><rect x="300" y="700" width="18" height="18"/>
      <rect x="1280" y="762" width="18" height="18"/><rect x="1360" y="762" width="18" height="18"/>
      <rect x="1440" y="762" width="18" height="18"/><rect x="1520" y="762" width="18" height="18"/>
      <g transform="translate(700 760)"><path d="M0 -14 L14 0 L0 14 L-14 0 Z"/></g>
      <g transform="translate(780 760)"><path d="M0 -14 L14 0 L0 14 L-14 0 Z"/></g>
      <g transform="translate(860 760)"><path d="M0 -14 L14 0 L0 14 L-14 0 Z"/></g>
    </g>

    <rect width="1600" height="900" filter="url(#grain)" opacity="0.5"/>
  </g>
</svg>
