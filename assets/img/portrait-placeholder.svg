<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Emplacement réservé au portrait de Soumailou Touré">
  <title>Portrait — emplacement à remplacer</title>
  <defs>
    <filter id="pgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="#1B2A4A"/>
  <!-- silhouette duotone indigo -->
  <g fill="#131E38">
    <path d="M400 640c-150 0-262 84-262 196v164H662V836c0-112-112-196-262-196Z"/>
    <circle cx="400" cy="430" r="150"/>
  </g>
  <g fill="none" stroke="#C9962C" stroke-width="2" opacity="0.5">
    <circle cx="400" cy="430" r="188"/>
    <path d="M400 190 v60 M400 610 v60 M160 430 h60 M580 430 h60"/>
  </g>
  <!-- repères type cadrage -->
  <g fill="none" stroke="#F4EFE3" stroke-width="2" opacity="0.35">
    <path d="M48 48 h84 M48 48 v84 M752 48 h-84 M752 48 v84 M48 952 h84 M48 952 v-84 M752 952 h-84 M752 952 v-84"/>
  </g>
  <text x="400" y="112" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="30" letter-spacing="4" fill="#C9962C">PORTRAIT</text>
  <text x="400" y="906" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="24" letter-spacing="2" fill="#F4EFE3" opacity="0.7">remplacer par portrait.jpg</text>
  <rect width="800" height="1000" filter="url(#pgrain)" opacity="0.6"/>
</svg>
